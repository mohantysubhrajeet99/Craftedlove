<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CraftedLove | Handmade Artisanal Treasures & Chocolates</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Initial Loading State Served Prior to Vue Hydration -->
